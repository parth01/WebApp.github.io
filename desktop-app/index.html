<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Details Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f9;color:#333}.topbar{background:#2c3e50;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.topbar h2{margin:0;font-size:20px}.topbar button{background:#fff;color:#2c3e50}.container{max-width:1200px;margin:24px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 12px #0001}.form-group{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}input,select{padding:9px;border:1px solid #ddd;border-radius:5px}input[type=text],select{flex:1;min-width:160px}button{padding:9px 15px;border:0;border-radius:5px;background:#3498db;color:#fff;cursor:pointer}button:hover{background:#2980b9}.danger{background:#c0392b}.success{background:#27ae60}.admin{background:#8e44ad}.category{background:#16a085}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.section-title{text-align:center;color:#2c3e50}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:10px;text-align:center;border:1px solid #ddd}th{background:#f8f9fa}.total-label{display:none;font-weight:bold;font-size:18px;text-align:right;margin-top:12px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.toast{visibility:hidden;position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:14px 20px;border-radius:5px;z-index:20}.toast.show{visibility:visible}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:10}.modal.hidden{display:none}.card{background:#fff;border-radius:10px;padding:25px;width:min(1000px,92vw);max-height:88vh;overflow:auto}.login-card{max-width:420px}.card h2{margin-top:0}.full{width:100%;margin:8px 0}.record{border:1px solid #ddd;border-radius:7px;padding:10px;margin:8px 0}.record button{margin-left:8px}.muted{color:#777;font-size:13px}.admin-grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.container{margin:10px;padding:14px}}
@media print{.topbar,.toolbar,.form-group button,#addItemButton,#saveRecordButton,#adminButton,.bottom button,.toast{display:none!important}.container{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>
<body>
<div id="loginModal" class="modal">
  <div class="card login-card">
    <h2>Medicine Details Manager</h2>
    <p class="muted">Sign in to use this computer's local medicine records.</p>
    <input id="loginUser" class="full" type="text" placeholder="Username">
    <input id="loginPassword" class="full" type="password" placeholder="Password">
    <button id="loginButton" class="full success">Sign In</button>
    <div id="loginMessage" class="muted"></div>
  </div>
</div>

<div id="adminModal" class="modal hidden">
  <div class="card">
    <h2>Superuser / Admin View</h2>
    <div class="admin-grid">
      <div>
        <h3>Create User</h3>
        <input id="newUser" class="full" placeholder="Username">
        <input id="newPassword" class="full" type="password" placeholder="Password">
        <button id="createUserButton" class="full success">Create User</button>
        <h3>Users</h3><div id="usersList"></div>
      </div>
      <div>
        <h3>All Saved Records</h3>
        <p class="muted">Records are read from C:\\medicine data\\records.</p>
        <div id="recordsList"></div>
      </div>
    </div>
    <button id="closeAdminButton">Close</button>
  </div>
</div>

<div id="appShell" style="display:none">
<div class="topbar"><h2>💊 Medicine Details Manager</h2><div><span id="loggedInAs"></span> <button id="adminButton" class="admin" style="display:none">Admin View</button> <button id="logoutButton">Log Out</button></div></div>
<div class="container">
<h1 id="pageTitle" class="section-title">Details of Medicine</h1>
<div class="form-group">
<input id="nameInput" type="text" placeholder="Enter name">
<button id="saveButton">Save Name</button>
<label>Batch No:</label><input id="batchNumberInput" type="text" placeholder="Enter batch number">
<input id="datePicker" type="date">
<select id="nameDropdown"><option value="">Select a saved name</option></select>
<button id="deleteButton" class="danger">Delete Name</button>
</div>
<div class="toolbar">
<button id="medicine" class="category">Medicine</button><button id="vaccination" class="category">Vaccination</button><button id="disinfect" class="category">Disinfect</button><button id="addItemButton">Add Item</button>
</div>
<div class="table-wrap"><table id="stockTable"><thead><tr><th>Item Name</th><th>Rate</th><th>Quantity</th><th>Amount</th></tr></thead><tbody></tbody></table></div>
<div class="bottom"><button id="calculateButton">Calculate</button><div id="totalLabel" class="total-label"></div><div><button id="saveRecordButton" class="success">💾 Save Record</button> <button id="printButton">Print</button></div></div>
<div id="toast" class="toast"></div>
</div></div>
<script src="app.js"></script>
</body>
</html>
