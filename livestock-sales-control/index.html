<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Livestock Sales Control</title><link rel="stylesheet" href="css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="loginView" class="auth-shell"><div class="card auth-card"><h1>Livestock Sales Control</h1><p class="muted">Inventory, weight, sales and reconciliation.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Sign in</button><p id="loginError" class="error"></p></form></div></div><div id="appView" hidden><header class="topbar"><div><h1>Livestock Sales Control</h1><span id="userLabel" class="muted"></span></div><button id="logoutBtn">Sign out</button></header><nav class="tabs"><button data-tab="dashboard" class="tab active">Dashboard</button><button data-tab="receipts" class="tab">Farm Receipts</button><button data-tab="receiving" class="tab">Shop Receiving</button><button data-tab="outgoing" class="tab">Sales / Employee / Mortality</button><button data-tab="rates" class="tab">Rates</button><button data-tab="reports" class="tab">Reports</button><button data-tab="audit" class="tab admin-only" hidden>Audit Log</button></nav><main><section id="dashboard" class="tab-panel"><div class="toolbar"><label>Date<input id="dashboardDate" type="date"></label><button id="refreshDashboard">Refresh</button></div><div id="kpis" class="grid kpi-grid"></div><div class="grid two"><div class="card"><h2>Reconciliation</h2><div id="reconciliation"></div></div><div class="card"><h2>Alerts</h2><div id="alerts"></div></div></div></section><section id="receipts" class="tab-panel" hidden><div class="card"><h2>Record farm shipment</h2><form id="receiptForm" class="form-grid"><label>Date/time<input id="receiptAt" type="datetime-local" required></label><label>Farm<input id="farmName" required></label><label>Reference<input id="receiptRef"></label><label>Bird count<input id="receiptCount" type="number" min="0" required></label><label>Total weight (kg)<input id="receiptWeight" type="number" min="0" step="0.01" required></label><label>Notes<textarea id="receiptNotes"></textarea></label><button class="primary">Save shipment</button></form></div><div class="card"><h2>Recent shipments</h2><div id="receiptTable"></div></div></section><section id="receiving" class="tab-panel" hidden><div class="card"><h2>Record shop receiving</h2><form id="receivingForm" class="form-grid"><label>Farm shipment<select id="receiptSelect" required></select></label><label>Date/time<input id="receivingAt" type="datetime-local" required></label><label>Live count<input id="liveCount" type="number" min="0" required></label><label>Live weight (kg)<input id="liveWeight" type="number" min="0" step="0.01" required></label><label>Transport mortality count<input id="mortalityCount" type="number" min="0" value="0" required></label><label>Transport mortality weight (kg)<input id="mortalityWeight" type="number" min="0" step="0.01" value="0" required></label><label>Notes<textarea id="receivingNotes"></textarea></label><button class="primary">Save receiving</button></form></div><div class="card"><h2>Receiving records</h2><div id="receivingTable"></div></div></section><section id="outgoing" class="tab-panel" hidden><div class="card"><h2>Record outgoing stock</h2><form id="outgoingForm" class="form-grid"><label>Date/time<input id="outgoingAt" type="datetime-local" required></label><label>Type<select id="outgoingType"><option value="sale">Sale</option><option value="employee">Employee / bird</option><option value="mortality">Mortality</option><option value="adjustment">Adjustment</option></select></label><label>Category<select id="category"><option value="big">Big</option><option value="small">Small</option><option value="other">Other</option></select></label><label>Bird count<input id="outgoingCount" type="number" min="0" required></label><label>Weight (kg)<input id="outgoingWeight" type="number" min="0" step="0.01" required></label><label>Rate ($/kg)<input id="outgoingRate" type="number" min="0" step="0.0001"></label><label>Reference<input id="outgoingRef"></label><label>Notes<textarea id="outgoingNotes"></textarea></label><button class="primary">Save outgoing record</button></form></div><div class="card"><h2>Recent outgoing records</h2><div id="outgoingTable"></div></div></section><section id="rates" class="tab-panel" hidden><div class="card"><h2>Rates</h2><form id="rateForm" class="form-grid"><label>Effective date/time<input id="rateAt" type="datetime-local" required></label><label>Category<select id="rateCategory"><option value="big">Big</option><option value="small">Small</option><option value="other">Other</option><option value="employee">Employee</option></select></label><label>Rate ($/kg)<input id="rateValue" type="number" min="0" step="0.0001" required></label><button class="primary">Save rate</button></form></div><div class="card"><div id="rateTable"></div></div></section><section id="reports" class="tab-panel" hidden><div class="card"><h2>Daily / monthly reconciliation</h2><div class="toolbar"><label>Date<input id="reportDate" type="date"></label><label>Month<input id="reportMonth" type="month"></label><button id="runReport" class="primary">Run report</button><button id="exportReport">Export CSV</button></div><div id="reportOutput"></div></div></section><section id="audit" class="tab-panel" hidden><div class="card"><h2>Audit log</h2><div id="auditTable"></div></div></section></main></div><script src="js/config.js"></script><script src="js/app.js"></script></body></html>
